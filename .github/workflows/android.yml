name: Build Rafeno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html style.css script.js www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          npx cap init Rafeno com.rafeno.app --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web assets
        run: |
          npx cap sync

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore rafeno.keystore \
            -alias rafeno \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rafeno123 -keypass rafeno123 \
            -dname "CN=Rafeno, OU=Mobile, O=Rafeno, L=Mogadishu, S=Banaadir, C=SO"

      - name: Inject signing config into build.gradle
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          signing_configs = '''    signingConfigs {
              release {
                  storeFile file(System.getenv("KEYSTORE_PATH") ?: "../../rafeno.keystore")
                  storePassword System.getenv("KEYSTORE_PASSWORD") ?: "rafeno123"
                  keyAlias System.getenv("KEY_ALIAS") ?: "rafeno"
                  keyPassword System.getenv("KEY_PASSWORD") ?: "rafeno123"
              }
          }
          '''

          idx = content.find('android {')
          if idx != -1:
              insert_pos = idx + len('android {')
              content = content[:insert_pos] + '\n' + signing_configs + content[insert_pos:]

          pattern = r'(buildTypes\s*\{[\s\S]*?release\s*\{)'
          match = re.search(pattern, content)
          if match:
              insert_pos = match.end()
              content = content[:insert_pos] + '\n            signingConfig signingConfigs.release' + content[insert_pos:]

          with open(path, 'w') as f:
              f.write(content)
          PYEOF

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename and verify APK
        run: |
          ls -la android/app/build/outputs/apk/release/
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafeno-release-apk
          path: output/app-release.apk
          retention-days: 30
