name: Build Rafeno APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/; echo "✓ index.html"; else echo "✗ index.html MISSING"; exit 1; fi
          if [ -f style.css ]; then cp style.css www/; echo "✓ style.css"; else echo "✗ style.css MISSING"; exit 1; fi
          if [ -f script.js ]; then cp script.js www/; echo "✓ script.js"; else echo "✗ script.js MISSING"; exit 1; fi
          echo "--- www contents ---"
          ls -la www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor
        run: |
          npx cap init Rafeno com.rafeno.app --web-dir=www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web assets
        run: |
          npx cap sync

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore rafeno.keystore \
            -alias rafeno \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rafeno123 -keypass rafeno123 \
            -dname "CN=Rafeno, OU=Mobile, O=Rafeno, L=Mogadishu, S=Banaadir, C=SO"

      - name: Configure signing in build.gradle
        run: |
          python3 << 'PYEOF'
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # Insert signingConfigs block right after "android {"
          signing_block = '''    signingConfigs {
              release {
                  storeFile file("../../rafeno.keystore")
                  storePassword "rafeno123"
                  keyAlias "rafeno"
                  keyPassword "rafeno123"
              }
          }
          '''
          m = re.search(r'android\s*\{', content)
          if m:
              pos = m.end()
              content = content[:pos] + '\n' + signing_block + content[pos:]

          # Add signingConfig to release buildType
          m2 = re.search(r'(buildTypes\s*\{[\s\S]*?release\s*\{)', content)
          if m2:
              pos = m2.end()
              content = content[:pos] + '\n            signingConfig signingConfigs.release' + content[pos:]

          with open(path, 'w') as f:
              f.write(content)
          print("✓ build.gradle patched")
          PYEOF

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/app-release.apk
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafeno-release-apk
          path: output/app-release.apk
          retention-days: 30
